<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Malabar Gallery | Food & Restaurant</title><meta name="description" content="See Hotel Malabar food and restaurant images in the official gallery."><link rel="canonical" href="https://malabarhotel.in/gallery.html"><style>body{margin:0;background:#0a1f13;color:#fcfaf6;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:32px 18px}a{color:#dfb64c}.top{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid #244c34;padding-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid #2b5d3e}.muted{color:#b9c8be}</style></head><body><main><nav class="top"><a href="/">Hotel Malabar</a><a href="/menu.html">Menu</a><a href="/contact.html">Contact Us</a><a href="/about.html">About Us</a><a href="/gallery.html">Gallery</a></nav><h1>Hotel Malabar Gallery</h1><p class="muted">Food and restaurant highlights from Hotel Malabar.</p><div id="gallery" class="grid"><p>Loading gallery…</p></div></main><script>(async()=>{const g=document.getElementById('gallery');try{const r=await fetch('/api/menu');const d=await r.json();const items=(d.items||[]).filter(i=>i.imageUrl);g.innerHTML=items.map(i=>`<figure><img src="${safe(i.imageUrl)}" alt="${safe(i.name)} at Hotel Malabar" loading="lazy"><figcaption>${safe(i.name)}</figcaption></figure>`).join('')||'<p>No gallery images are currently available.</p>'}catch(e){g.innerHTML='<p>Gallery is temporarily unavailable.</p>'}})();function safe(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</script></body></html>
