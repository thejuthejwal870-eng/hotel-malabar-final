<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel Malabar Menu | Authentic Malabar Food</title>
  <meta name="description" content="Explore the Hotel Malabar menu with authentic Malabar and Kerala dishes, biryani, porotta, seafood and more." />
  <link rel="canonical" href="https://malabarhotel.in/menu.html" />
  <style>
    :root{--green:#123d27;--gold:#c39a2d;--cream:#fffefa;--line:#e1e7e2;--muted:#627068}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:#183225;font-family:Arial,sans-serif}
    main{max-width:1100px;margin:auto;padding:22px 18px 40px}
    a{color:var(--green);text-decoration:none}
    a:hover{color:#b28718}
    h1{font-size:38px;color:var(--green);margin:28px 0 10px}
    h2{color:var(--green);margin-top:30px}
    .top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}
    .top a{padding:9px 15px;border:1px solid #b9cdbf;border-radius:999px;background:#fff;font-weight:700}
    .top a:first-child{background:#f7f3e9;border-color:#d6ae3a}
    .muted{color:var(--muted);line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(19,61,39,.06)}
    .card strong{color:#183225;font-size:17px}
    .price{color:#b28718;font-weight:800;font-size:18px;margin-top:10px}
  </style>
</head>
<body><main>
  <nav class="top"><a href="/">Hotel Malabar</a><a href="/menu.html">Menu</a><a href="/contact.html">Contact Us</a><a href="/about.html">About Us</a><a href="/gallery.html">Gallery</a></nav>
  <h1>Hotel Malabar Menu</h1>
  <p class="muted">Authentic Malabar and Kerala delicacies. Cash on Delivery available for online orders.</p>
  <div id="menu"><p class="muted">Loading menu…</p></div>
</main>
<script>
(async()=>{const root=document.getElementById('menu');try{const r=await fetch('/api/menu');const d=await r.json();const cats=d.categories||[];const items=d.items||[];root.innerHTML=cats.filter(c=>c.isActive!==false).map(c=>{const list=items.filter(i=>i.categoryId===c.id);return list.length?`<section><h2>${escapeHtml(c.name)}</h2><div class="grid">${list.map(i=>`<article class="card"><strong>${escapeHtml(i.name)}</strong><p class="muted">${escapeHtml(i.description||'')}</p><div class="price">₹${Number(i.price||0).toFixed(0)}</div></article>`).join('')}</div></section>`:''}).join('')||'<p class="muted">No menu items are currently available.</p>'}catch(e){root.innerHTML='<p class="muted">Menu is temporarily unavailable. Please try again shortly.</p>'}})();
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
