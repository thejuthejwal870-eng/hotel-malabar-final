name: Build Hotel Malabar Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-admin-alerts/**"
      - ".github/workflows/build-admin-alerts.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build debug APK
        working-directory: android-admin-alerts
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotel-malabar-admin-alerts-debug
          path: android-admin-alerts/app/build/outputs/apk/debug/app-debug.apk

# Native Android admin app build: background alerts + RPD-588 Bluetooth KOT printing.
# Latest native responsive WebView layout fix included.
# Responsive WebView layout fix included in latest native build.
# This workflow intentionally runs on pushes to android-admin-alerts so the APK is rebuilt automatically.
